  font-weight: 700;
}
.font-extrabold{
  font-weight: 800;
}
.leading-none{
  line-height: 1;
}
.leading-relaxed{
  line-height: 1.625;
}
.leading-snug{
  line-height: 1.375;
}
.leading-tight{
  line-height: 1.25;
}
.tracking-\[0\.25em\]{
  letter-spacing: 0.25em;
}
.tracking-\[0\.3em\]{
  letter-spacing: 0.3em;
}
.tracking-wide{
  letter-spacing: 0.025em;
}
.tracking-wider{
  letter-spacing: 0.05em;
}
.tracking-widest{
  letter-spacing: 0.1em;
}
.text-\[var\(--accent\)\]{
  color: var(--accent);
}
.text-\[var\(--bad\)\]{
  color: var(--bad);
}
.text-\[var\(--ink\)\]{
  color: var(--ink);
}
.text-\[var\(--muted\)\]{
  color: var(--muted);
}
.text-black{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.ring{
  --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(3px + var(--tw-ring-offset-width)) var(--tw-ring-color);
  box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
}
.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}
.transition-colors{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
:root {
  --bg: #060605;
  --panel: #0b0b08;
  --panel-2: #101006;
  --line: #26261a;
  --line-strong: #45452c;
  --ink: #f4f3e6;
  --muted: #a3a28c;
  --accent: #ffe600;
  --accent-ink: #0a0a00;
  --ok: #00e676;
  --bad: #ff2e2e;
  --warn: #ff9f1c;
  --off: #55553f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #060605;
    --panel: #0b0b08;
    --panel-2: #101006;
    --line: #26261a;
    --line-strong: #45452c;
    --ink: #f4f3e6;
    --muted: #a3a28c;
    --accent: #ffe600;
    --accent-ink: #0a0a00;
    --ok: #00e676;
    --bad: #ff2e2e;
    --warn: #ff9f1c;
    --off: #55553f;
  }
}
html, body {
  background: var(--bg);
}
body {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--ink);
}
::-moz-selection {
  background: var(--accent);
  color: #000;
}
::selection {
  background: var(--accent);
  color: #000;
}
.scanlines {
  background-image: repeating-linear-gradient(0deg, rgba(255, 230, 0, 0.022) 0 1px, transparent 1px 3px);
}
@keyframes sweep {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
.radar-sweep {
  transform-box: view-box;
  transform-origin: center;
  animation: sweep 6s linear infinite;
}
@keyframes blinkdot {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.2;
  }
}
.blink {
  animation: blinkdot 1.1s steps(2) infinite;
}
.tbtn {
  border: 1px solid var(--line-strong);
  padding: 6px 10px;
  font-size: 11px;
  letter-spacing: 0.08em;
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
  text-transform: uppercase;
}
.tbtn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.tbtn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.tbtn-primary {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 700;
}
.tbtn-primary:hover {
  color: #000;
  filter: brightness(1.12);
}
.tin {
  background: #000;
  border: 1px solid var(--line-strong);
  color: var(--ink);
  padding: 8px 10px;
  font-family: inherit;
  font-size: 12px;
  width: 100%;
}
.tin:focus {
  outline: 1px solid var(--accent);
  border-color: var(--accent);
}
.logscroll::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
.logscroll::-webkit-scrollbar-thumb {
  background: var(--line-strong);
}
.logscroll::-webkit-scrollbar-track {
  background: #000;
}
.last\:border-b-0:last-child{
  border-bottom-width: 0px;
}
.hover\:border-\[var\(--bad\)\]:hover{
  border-color: var(--bad);
}
.hover\:text-\[var\(--bad\)\]:hover{
  color: var(--bad);
}
.disabled\:opacity-40:disabled{
  opacity: 0.4;
}
@media (min-width: 640px){
  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sm\:grid-cols-\[240px_1fr\]{
    grid-template-columns: 240px 1fr;
  }
  .sm\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:text-\[11px\]{
    font-size: 11px;
  }
  .sm\:text-lg{
    font-size: 1.125rem;
    line-height: 1.75rem;
  }
  .sm\:text-xl{
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}
@media (min-width: 768px){
  .md\:col-span-2{
    grid-column: span 2 / span 2;
  }
  .md\:inline{
    display: inline;
  }
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (min-width: 1024px){
  .lg\:flex-row{
    flex-direction: row;
  }
}
@media (min-width: 1280px){
  .xl\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
